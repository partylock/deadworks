name: PartyLock Launcher

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

jobs:
  release-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: launcher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run build:win
        env:
          VITE_PARTYLOCK_API_URL: https://api.partylock.com.br/api/v1

      - name: Stage installer
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path $bundle)) { throw "Pasta NSIS nao encontrada: $bundle" }
          $installer = Get-ChildItem $bundle -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Nenhum .exe em $bundle" }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $installer.FullName "release-assets/$($installer.Name)"
          Write-Host "Instalador: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PartyLock Launcher ${{ github.ref_name }}
          files: launcher/release-assets/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run build:win
        env:
          VITE_PARTYLOCK_API_URL: https://api.partylock.com.br/api/v1

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: partylock-launcher-windows
          path: launcher/release-assets/*.exe
          if-no-files-found: error
